[package]
name = "pst"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
memchr = "2.8"
serde_json = "1"

# Smaller release binary -> smaller, faster Homebrew download.
[profile.release]
strip = true
lto = true
codegen-units = 1
